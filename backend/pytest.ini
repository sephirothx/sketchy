[pytest]
pythonpath = .
testpaths = tests
addopts = --ignore=tests/e2e
# Every async test in this tree is one pytest-asyncio should run, and saying so
# once here is the alternative to a `pytest.mark.asyncio` on each of them - 565
# decorators and 59 module-level `pytestmark` lines, whose only other effect was
# to land on the sync tests sitting beside them and warn 26 times a run.
asyncio_mode = auto
# What pytest-asyncio already does; pinned because its default is changing and
# an unset value warns on every run.
asyncio_default_fixture_loop_scope = function
