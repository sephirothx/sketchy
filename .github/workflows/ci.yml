name: CI

on:
  push:
    branches: [main]
  # Child issue branches merge through epic umbrellas before reaching main.
  # Run the same checks regardless of which branch a pull request targets.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - run: pytest -q

  postgresql:
    name: PostgreSQL migrations & repositories
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: sketchy_test
          POSTGRES_USER: sketchy
          POSTGRES_PASSWORD: sketchy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sketchy -d sketchy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://sketchy:sketchy@localhost:5432/sketchy_test
      TEST_DATABASE_URL: postgresql+asyncpg://sketchy:sketchy@localhost:5432/sketchy_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Upgrade a fresh PostgreSQL database
        run: python -m app.db.migrate

      - name: Run repositories against PostgreSQL
        run: pytest -q tests/test_repositories.py

  frontend:
    name: Frontend test, lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm test

      - run: npm run lint

      - run: npm run build

  e2e:
    name: E2E multi-browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Create backend virtualenv and install dependencies
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/pip install -q -r backend/requirements-dev.txt

      # Cache the browser binaries so a green run touches the Playwright CDN
      # not at all. Keyed on the pinned playwright version, so a bump
      # re-downloads rather than reusing browsers the new client cannot drive.
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('backend/requirements-dev.txt') }}

      # Deliberately without --with-deps. That flag spent ~66s of a ~76s step
      # running apt, and it is where this job hung twice on an unreachable
      # Ubuntu mirror. Everything it installed was fonts (CJK, Thai, Cyrillic)
      # and media codecs (x264, vpx, opus, dav1d) - the real browser runtime
      # libraries (libnss3, libgbm, libatk, libasound2) are already on the
      # runner image, which ships Chrome and Firefox. These tests draw on a
      # canvas, mute audio, record no video, and assert only Latin text.
      #
      # If a browser ever fails to launch here, run `playwright install-deps`
      # and add back only the package it names.
      - name: Install Playwright browsers
        timeout-minutes: 5
        run: backend/.venv/bin/python -m playwright install --only-shell chromium firefox

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Run E2E tests
        run: bash scripts/test-e2e.sh
