name: CI

on:
  push:
    branches: [main]
  # Child issue branches merge through epic umbrellas before reaching main.
  # Run the same checks regardless of which branch a pull request targets.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-hygiene:
    name: Repository artifact scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The range scan below needs both ends of the change, not just its tip.
          fetch-depth: 0

      # Cheap and first: a committed database or key is worth failing on before
      # anyone spends a runner on tests. `.githooks/pre-push` runs the same
      # script locally for whoever opts in.
      - name: Scan the tracked tree
        run: bash scripts/check-tracked-artifacts.sh

      # The tip scan above cannot see a file that was committed and then deleted
      # a commit later: the tree ends up clean and the blob stays in history for
      # good. Scan what the change actually adds, the way pre-push does.
      - name: Scan every commit the change adds
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # The floor comes from the script, not from a copy of the sha kept
          # here, so this and `.githooks/pre-push` cannot drift apart on it.
          BASELINE="$(bash scripts/check-tracked-artifacts.sh --baseline)"
          # An all-zero or unreachable base means there is no far end to diff
          # against - a new branch, or a force-push over a discarded commit.
          # Falling back to the tip scan there would wave through exactly the
          # case this step exists for: commit a secret, delete it a commit later,
          # clean tree, green build. Fall back to the baseline floor instead, so
          # every commit that could still be scanned is.
          if git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            # The fork point, clamped: a base branch that forked before the
            # baseline would otherwise pull the range back over the commit that
            # added the database, and fail every build from then on.
            from="$(bash scripts/check-tracked-artifacts.sh --floor "$(git merge-base "$BASE" HEAD)")"
          elif git cat-file -e "${BASELINE}^{commit}" 2>/dev/null; then
            echo "No reachable base commit; scanning everything since the baseline."
            from="$BASELINE"
          else
            # This job clones in full, so an unreachable baseline here is not a
            # shallow checkout - it is a sha that has stopped resolving, which
            # would silently drop both this step and the hook to their weakest
            # fallback. Fail instead, and say what to fix.
            echo "Baseline ${BASELINE} does not resolve in a full clone." >&2
            echo "Update HISTORY_BASELINE in scripts/check-tracked-artifacts.sh." >&2
            exit 1
          fi
          bash scripts/check-tracked-artifacts.sh --range "${from}..HEAD"

      # The scan above knows this project's own artifact shapes - a database,
      # a key file - by magic bytes. It knows nothing about a credential
      # pasted into source, which is a different failure with the same cost.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSLf -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          # Pinned by digest, not just by tag: a release asset can be replaced.
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      # --baseline-path carries the one historical finding this repository
      # already has: an earlier revision of the artifact scanner named PEM
      # armour in a comment, because naming it is how it detects it. The entry
      # is pinned to that commit, file, rule, and line, and holds no secret -
      # it cannot excuse anything else, and history cannot be edited to remove
      # the finding itself.
      - name: Scan the tree for credentials
        run: |
          gitleaks dir . --no-banner --redact --exit-code 1 \
            --baseline-path .gitleaks-known.json

      # The tree scan cannot see a credential that was committed and then
      # removed a commit later, which is the case that matters most: the value
      # is burned either way, and the tree looks clean.
      #
      # The range is resolved exactly as the artifact scan above resolves it,
      # including the baseline fallback. Falling back to "the tree scan stands
      # alone" would wave through the one case this step exists for, on a
      # first push or a force-push where `before` no longer resolves - which
      # is a hole an actor can simply choose to push into.
      - name: Scan every commit the change adds for credentials
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          BASELINE="$(bash scripts/check-tracked-artifacts.sh --baseline)"
          if git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            from="$(bash scripts/check-tracked-artifacts.sh --floor "$(git merge-base "$BASE" HEAD)")"
          elif git cat-file -e "${BASELINE}^{commit}" 2>/dev/null; then
            echo "No reachable base commit; scanning everything since the baseline."
            from="$BASELINE"
          else
            echo "Baseline ${BASELINE} does not resolve in a full clone." >&2
            echo "Update HISTORY_BASELINE in scripts/check-tracked-artifacts.sh." >&2
            exit 1
          fi
          # -m is load-bearing: `gitleaks git` runs `git log -p`, which emits
          # no patch for a merge commit unless asked. A secret introduced only
          # while resolving a conflict - present in neither parent - and
          # removed in the next commit is invisible to both this scan and the
          # tree scan without it. Verified against a real evil merge: no leaks
          # found without the flag, found with it.
          # scripts/check-tracked-artifacts.sh handles merges for the same
          # reason, and has its own test for it.
          gitleaks git . --no-banner --redact --exit-code 1 \
            --baseline-path .gitleaks-known.json --log-opts="-m ${from}..HEAD"

      # The mockup artboards are generated files that open like source, so a
      # hand edit to one is invisible until someone rebuilds and loses it.
      # No install: the generator is plain node with no dependencies.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Check the mockups still match their generator
        run: bash scripts/check-mockups-regenerated.sh

  backend:
    name: Backend lint & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - run: ruff check app tests

      # --cov-branch, because "unexecuted branches" is the finding: a statement
      # measure marks an `if` covered the moment it is reached, whatever the
      # condition did.
      - run: pytest -q --cov=app --cov-branch --cov-report=term:skip-covered --cov-report=json:coverage.json

      # A whole-suite percentage moves too little to catch one module losing
      # its tests, which is the shape the audit called out. The floors are per
      # module, on the ones where an unexecuted branch is a way in or a way to
      # lose data.
      - name: Check coverage floors
        run: python3 ../scripts/check-coverage.py coverage.json

  postgresql:
    name: PostgreSQL migrations & repositories
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: sketchy_test
          POSTGRES_USER: sketchy
          POSTGRES_PASSWORD: sketchy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sketchy -d sketchy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://sketchy:sketchy@localhost:5432/sketchy_test
      TEST_DATABASE_URL: postgresql+asyncpg://sketchy:sketchy@localhost:5432/sketchy_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Upgrade a fresh PostgreSQL database
        run: python -m app.db.migrate

      - name: Replay migrations in both directions and check schema drift
        run: pytest -q tests/test_migrations.py

      # Constraints are the dialect-sensitive half of the schema: a CHECK that
      # holds on SQLite's stored hex can behave differently against
      # PostgreSQL's native types. Run the model suite here too, or the only
      # engine those constraints are ever proven on is the one production does
      # not use.
      - name: Run schema constraints against PostgreSQL
        run: pytest -q tests/test_db_models.py

      - name: Run repositories against PostgreSQL
        run: pytest -q tests/test_repositories.py

      - name: Run row-locking services against PostgreSQL
        run: pytest -q tests/test_room_presets.py tests/test_room_codes.py tests/test_rate_limit_atomicity.py

  frontend:
    name: Frontend test, lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm test

      - run: npm run lint

      - run: npm run build

  supply-chain:
    name: Dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: pip install -r requirements-dev.txt
        working-directory: backend

      - run: npm ci
        working-directory: frontend

      # Both manifests, not only the shipped one: a compromised test or build
      # dependency runs here, with a checkout and a token, before anything it
      # touched reaches a user.
      - name: Audit Python dependencies
        working-directory: backend
        run: |
          pip-audit -r requirements.txt --progress-spinner off
          pip-audit -r requirements-dev.txt --progress-spinner off

      # No --audit-level: R-ENG-14 says any known advisory fails, and a
      # threshold here would have quietly meant something else.
      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit

  e2e:
    name: E2E multi-browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Create backend virtualenv and install dependencies
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/pip install -q -r backend/requirements-dev.txt

      # Cache the browser binaries so a green run touches the Playwright CDN
      # not at all. Keyed on the pinned playwright version, so a bump
      # re-downloads rather than reusing browsers the new client cannot drive.
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('backend/requirements-dev.txt') }}

      # Deliberately without --with-deps. That flag spent ~66s of a ~76s step
      # running apt, and it is where this job hung twice on an unreachable
      # Ubuntu mirror. Everything it installed was fonts (CJK, Thai, Cyrillic)
      # and media codecs (x264, vpx, opus, dav1d) - the real browser runtime
      # libraries (libnss3, libgbm, libatk, libasound2) are already on the
      # runner image, which ships Chrome and Firefox. These tests draw on a
      # canvas, mute audio, record no video, and assert only Latin text.
      #
      # If a browser ever fails to launch here, run `playwright install-deps`
      # and add back only the package it names.
      - name: Install Playwright browsers
        timeout-minutes: 5
        run: backend/.venv/bin/python -m playwright install --only-shell chromium firefox

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Run E2E tests
        run: bash scripts/test-e2e.sh
