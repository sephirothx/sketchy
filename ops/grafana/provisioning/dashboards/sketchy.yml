# Sketchy's dashboards, provisioned from the repository (#968):
#
#   SKETCHY_GRAFANA_DASHBOARDS   the absolute path of ops/grafana/dashboards
#
# Read-only on purpose. The dashboards are generated by ops/grafana/generate.py
# and a change made in Grafana's UI would be overwritten on the next reload -
# edit the generator, regenerate, commit.
#
# Deletion stays enabled because the repository is the whole list: a dashboard
# whose file goes away - renamed uid, retired board - would otherwise stay in
# the Sketchy folder on every Grafana that ever provisioned it, still tagged
# and still in the links dropdown, drawing panels that no longer exist here.
apiVersion: 1
providers:
  - name: sketchy
    folder: Sketchy
    type: file
    disableDeletion: false
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: ${SKETCHY_GRAFANA_DASHBOARDS}
      foldersFromFilesStructure: false
