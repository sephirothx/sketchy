# Server settings for the PostgreSQL cluster Sketchy runs on (#889).
#
# Included from postgresql.conf (`include '/etc/postgresql/sketchy.conf'`) or
# passed line by line as `-c` flags by the Compose file of #405/#408. Every
# setting states its reason, because the next person to change one needs the
# reason more than the value. docs/database.md §13 "Server configuration"
# explains how the monthly review reads what these settings produce.
#
# Checked by backend/tests/test_postgres_config.py (every setting has a
# comment, the ones the alerts rely on are present) and, against a real
# server, by ops/postgres/check-config.sh.

# --- statement statistics ------------------------------------------------------

# Per-statement totals: calls, time, rows, blocks and WAL. Without it, "which
# statement costs the most" after a month of beta has no answer. Must be
# preloaded; the extension itself is created by ops/postgres/init.sql.
shared_preload_libraries = 'pg_stat_statements'

# Top-level statements only: the application sends no functions or DO blocks
# whose inner statements would matter, and nested tracking multiplies entries.
pg_stat_statements.track = top

# Planning time is not where this workload spends anything measurable, and
# tracking it costs a lock per plan.
pg_stat_statements.track_planning = off

# Distinct normalised statements kept. The application issues a few hundred;
# the headroom absorbs operator sessions without evicting the hot ones.
pg_stat_statements.max = 5000

# Block read and WAL write times in pg_stat_statements, pg_stat_database and
# pg_stat_io. Costs a clock read per I/O, negligible on any current kernel
# (pg_test_timing to confirm on the NAS), and without it I/O-bound and
# CPU-bound slowness look the same.
track_io_timing = on
track_wal_io_timing = on

# --- logging -------------------------------------------------------------------

# Who and which process, on every line: %a is the application_name the
# connections set (sketchy-web, sketchy-migration, sketchy-maintenance), so a
# slow statement names the role that ran it.
log_line_prefix = '%m [%p] %q%u@%d app=%a '

# A statement slower than this is logged with its duration. The application's
# statement histogram tops out at 30 s but says nothing about *which*
# statement; 250 ms is five times the SketchySlowQueries p95 threshold, rare
# enough to read every line. Lower it for an investigation, not permanently.
log_min_duration_statement = 250ms

# A session that waited deadlock_timeout (1 s) for a lock logs the wait and
# the holder. The web role gives up at 5 s (lock_timeout), so without this a
# lock-timeout error has no second half.
log_lock_waits = on

# Every autovacuum and autoanalyze run, with pages removed and time taken.
# The churn tables (room_messages, runtime_events, auth_rate_limit_buckets,
# finished_game_envelopes) are where the per-table thresholds will be tuned,
# and this log is the evidence that tuning needs.
log_autovacuum_min_duration = 0

# Any sort or hash that spilled to disk: the signal that work_mem is too small
# for some statement, named in the same line.
log_temp_files = 0

# Checkpoint timing and cause, the other half of the requested-versus-timed
# checkpoint alert.
log_checkpoints = on

# --- storage and WAL -----------------------------------------------------------

# Full-page images in WAL compressed with lz4: less WAL to write, archive and
# replay for a little CPU. The first write to each page after a checkpoint
# carries the whole page, which dominates WAL on update-heavy tables.
wal_compression = lz4

# New TOAST values compressed with lz4 instead of pglz: faster both ways at a
# similar ratio. The two drawing columns (turn_drawings.payload and
# player_report_drawing_evidence.payload) are STORAGE EXTERNAL and never compressed by the
# server - their bytes are already deflated - so this does not touch them.
default_toast_compression = lz4

# Fewer, spread-out checkpoints: fewer full-page images in WAL. A requested
# (size-triggered) checkpoint is the sign max_wal_size is too small, which is
# what SketchyPostgresCheckpointsRequested watches.
checkpoint_timeout = 15min
max_wal_size = 2GB

# --- memory and connections (sized for the NAS) --------------------------------
#
# Assumes the database container is given 2 GB of RAM and fast (SSD cache pool)
# storage. Re-derive all five from the host when that is known (#408); none of
# them is a correctness setting.

# The web process holds at most 10 (pool 5 + overflow 5); migration and
# operator commands one each; the exporter one; room for two psql sessions and
# the superuser reserve. Every idle connection costs memory, so this is small
# on purpose. SketchyPostgresConnectionsHigh warns at 80%.
max_connections = 40

# A quarter of the container's memory, the usual starting point.
shared_buffers = 512MB

# What the planner may assume the OS caches: the rest of the container.
effective_cache_size = 1536MB

# Per sort or hash node, per connection: 40 connections × a few nodes stays
# well inside the budget. log_temp_files says when a statement needs more.
work_mem = 8MB

# Vacuum, index builds and ALTER TABLE; one or two run at a time.
maintenance_work_mem = 128MB

# SSD: a random read costs about the same as a sequential one. On spinning
# disks set this back to 4.
random_page_cost = 1.1
