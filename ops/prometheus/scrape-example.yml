# A Prometheus scrape job for one Sketchy worker. `/metrics` is disabled
# until METRICS_TOKEN is set on the server and answers 401 without it.
scrape_configs:
  - job_name: sketchy
    metrics_path: /metrics
    scrape_interval: 15s
    authorization:
      credentials: "<METRICS_TOKEN>"
    static_configs:
      - targets: ["sketchy.example:8000"]

  # The synthetic game's series (sketchy_probe_*) do not come from the
  # application: `python -m app.probe --textfile ...` writes them for
  # node_exporter's textfile collector on whichever host runs the probe.
  # Without this job SketchyProbeStale fires on absence, which is the point.
  - job_name: sketchy-probe
    scrape_interval: 30s
    static_configs:
      - targets: ["monitor.example:9100"]

  # PostgreSQL's own view of itself (#889): per-table dead tuples and vacuum
  # times, cache hits, database size, transaction age, checkpoints and the
  # top statements. The exporter runs beside the database and connects as
  # sketchy_monitor (ops/postgres/init.sql), which holds pg_monitor and reads
  # no table data:
  #
  #   DATA_SOURCE_NAME="postgresql://sketchy_monitor:<password>@db:5432/sketchy?sslmode=disable"
  #   postgres_exporter \
  #     --collector.database_wraparound \
  #     --collector.stat_checkpointer \
  #     --collector.stat_statements --collector.stat_statements.limit=50 \
  #     --collector.statio_user_indexes
  #
  # The default collectors (database, stat_database, stat_user_tables,
  # statio_user_tables, stat_bgwriter, wal, locks) stay on. The flags above add
  # what the rules in rules/sketchy-postgres.yml read; the series names they
  # use are listed in backend/tests/test_alert_rules.py.
  - job_name: postgres
    scrape_interval: 30s
    static_configs:
      - targets: ["db.example:9187"]

  # The database volume's free space. `sketchy_data_disk_*` measures the
  # application's own volume and is only emitted on SQLite, where that is
  # where the data is; on PostgreSQL the data is on the database host, so
  # node_exporter there is the source. Restrict it to the data directory's
  # mount point.
  - job_name: postgres-host
    scrape_interval: 60s
    static_configs:
      - targets: ["db.example:9100"]

rule_files:
  - rules/sketchy-recording.yml
  - rules/sketchy-alerts.yml
  - rules/sketchy-postgres.yml
