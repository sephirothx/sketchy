# What pages, what warns, and what each one means. Thresholds follow
# docs/slo.md; runbook pointers go to README.md § On-call.
#
# `severity: page` is for a condition a player can feel right now or data
# already lost. `severity: warn` is for a trend that becomes a page if
# nobody looks. Every metric named here is checked against the server's
# exposition by backend/tests/test_alert_rules.py.
groups:
  - name: sketchy-alerts
    rules:
      # --- availability -----------------------------------------------------------
      - alert: SketchyDown
        expr: up{job="sketchy"} == 0
        for: 2m
        labels: {severity: page}
        annotations:
          summary: "Sketchy is not answering its scrape"
          runbook: "README.md#on-call"

      - alert: SketchyDatabaseUnreachable
        expr: sketchy_db_ready == 0
        for: 2m
        labels: {severity: page}
        annotations:
          summary: "The readiness probe cannot reach the database"
          runbook: "README.md#on-call"

      - alert: SketchyProbeFailing
        expr: sketchy_probe_success == 0
        for: 5m
        labels: {severity: page}
        annotations:
          summary: "The synthetic game has not succeeded for five minutes"
          description: "Step timings are in sketchy_probe_step_seconds; the failing step is the first one missing."
          runbook: "README.md#on-call"

      # A textfile keeps saying whatever the last run wrote, so "success 1"
      # from an hour ago is not success; and a series that was never
      # collected cannot compare equal to anything. Both are the monitoring
      # itself being down, which pages like the thing it monitors.
      - alert: SketchyProbeStale
        expr: >
          absent(sketchy_probe_last_run_timestamp_seconds)
          or (time() - sketchy_probe_last_run_timestamp_seconds) > 300
        for: 5m
        labels: {severity: page}
        annotations:
          summary: "The synthetic game has not run in the last five minutes, or its series is not being collected"
          description: "Check the probe's cron entry, the textfile path, and that the node_exporter textfile job is scraped (ops/prometheus/scrape-example.yml)."
          runbook: "README.md#on-call"

      # --- data already lost ---------------------------------------------------------
      - alert: SketchyHistoryWritesLost
        expr: increase(sketchy_history_writes_abandoned_total[1h]) > 0
        labels: {severity: page}
        annotations:
          summary: "A finished game's history was not saved (kind={{ $labels.kind }}, reason={{ $labels.reason }})"
          runbook: "README.md#on-call"

      - alert: SketchyFinishedGamesStuck
        expr: sketchy_finished_games_oldest_seconds > 3600
        for: 5m
        labels: {severity: warn}
        annotations:
          summary: "A finished game has been staged for over an hour without reaching history"
          description: "The handoff loop retries for about two hours before giving up; check the database and the history_handoff loop on the operations page."
          runbook: "README.md#on-call"

      - alert: SketchyRecorderDropping
        expr: increase(sketchy_events_dropped_total[10m]) > 0
        labels: {severity: warn}
        annotations:
          summary: "The runtime recorder is dropping observations to a full buffer"
          runbook: "README.md#on-call"

      - alert: SketchyLoopStopped
        expr: sketchy_loop_running == 0
        for: 1m
        labels: {severity: page}
        annotations:
          summary: "Background loop {{ $labels.loop }} has stopped and will not come back without a restart"
          runbook: "README.md#on-call"

      - alert: SketchyLoopFailing
        expr: sketchy_loop_consecutive_failures >= 3
        for: 5m
        labels: {severity: warn}
        annotations:
          summary: "Background loop {{ $labels.loop }} has failed {{ $value }} times in a row"
          runbook: "README.md#on-call"

      # --- what a player feels ----------------------------------------------------
      - alert: SketchyHighErrorRate
        expr: sketchy:http_error_ratio:5m > 0.01
        for: 5m
        labels: {severity: page}
        annotations:
          summary: "More than 1% of API requests are failing ({{ $value | humanizePercentage }})"
          runbook: "README.md#on-call"

      - alert: SketchySocketErrors
        expr: sketchy:socket_error_ratio:5m > 0.005
        for: 5m
        labels: {severity: page}
        annotations:
          summary: "More than 0.5% of client commands are raising ({{ $value | humanizePercentage }})"
          runbook: "README.md#on-call"

      - alert: SketchySlowRequests
        expr: sketchy:http_p95_seconds:5m > 0.3
        for: 10m
        labels: {severity: warn}
        annotations:
          summary: "API p95 is over 300 ms ({{ $value | humanizeDuration }})"
          runbook: "README.md#on-call"

      - alert: SketchySlowCommands
        expr: sketchy:socket_p95_seconds:5m > 0.1
        for: 10m
        labels: {severity: warn}
        annotations:
          summary: "Command handler p95 is over 100 ms ({{ $value | humanizeDuration }})"
          runbook: "README.md#on-call"

      - alert: SketchyLoopLag
        expr: sketchy:loop_lag_p95_seconds:5m > 0.25
        for: 5m
        labels: {severity: page}
        annotations:
          summary: "The event loop is stalling: lag p95 {{ $value | humanizeDuration }}"
          description: "Timers, hints and turn ends all fire late when this is high; it is a starved loop, not a slow database."
          runbook: "README.md#on-call"

      # --- saturation --------------------------------------------------------------
      - alert: SketchyPoolSaturated
        expr: sketchy:db_pool_fill_ratio >= 1
        for: 5m
        labels: {severity: warn}
        annotations:
          summary: "Every database connection is in use"
          description: "Full is not yet slow: SketchyPoolWaiting says whether requests are queueing for a connection."
          runbook: "README.md#on-call"

      # The wait the statement histogram cannot see (#892): its timer starts
      # once a connection is held. Tenth of a second at p95 is a request slow
      # before it has sent anything.
      - alert: SketchyPoolWaiting
        expr: sketchy:db_pool_wait_p95_seconds:5m > 0.1
        for: 5m
        labels: {severity: warn}
        annotations:
          summary: "Requests wait {{ $value | humanizeDuration }} at p95 for a database connection"
          description: "Look at sketchy_db_transaction_seconds by operation for what is holding connections, before raising DB_POOL_SIZE."
          runbook: "README.md#on-call"

      - alert: SketchyPoolTimeouts
        expr: increase(sketchy_db_pool_timeouts_total[10m]) > 0
        labels: {severity: page}
        annotations:
          summary: "Requests are failing because no database connection came free within DB_POOL_TIMEOUT_SECONDS"
          runbook: "README.md#on-call"

      # The lock order and the 5 s lock budget exist so that these stay at
      # zero; one is a finding, not noise.
      - alert: SketchyDatabaseDeadlocks
        expr: increase(sketchy_db_query_errors_total{cause=~"deadlock|serialization"}[1h]) > 0
        labels: {severity: warn}
        annotations:
          summary: "A transaction died of {{ $labels.cause }} in the last hour"
          description: "The PostgreSQL log (log_lock_waits) names both sides; sketchy_db_retries_total says whether a retry saved it."
          runbook: "README.md#on-call"

      - alert: SketchySlowQueries
        expr: sketchy:db_query_p95_seconds:5m > 0.05
        for: 10m
        labels: {severity: warn}
        annotations:
          summary: "Statement p95 is over 50 ms ({{ $value | humanizeDuration }})"
          runbook: "README.md#on-call"

      # Retention that runs is not retention that complies: a sweep removing
      # five thousand rows an hour on a table growing by six thousand looks
      # perfectly healthy. Both series carry the same `table` label, so this
      # one rule holds every table to its own SLA without naming any of them;
      # the policy lives in backend/app/auth/retention.py and docs/database.md
      # §10, and this rule stays true when it changes.
      - alert: SketchyRetentionBehind
        expr: sketchy_retention_overdue_seconds > sketchy_retention_sla_seconds
        for: 30m
        labels: {severity: warn}
        annotations:
          summary: "Retention on {{ $labels.table }} is past its SLA: oldest overdue row is {{ $value | humanizeDuration }} old"
          description: "The sweep is alive and behind, or starved of budget. sketchy_retention_backlog_rows says how much is waiting and sketchy_retention_sweep_exhausted whether the budget is the limit; raise RETENTION_SWEEP_ROW_BUDGET or shorten RETENTION_SWEEP_SECONDS before assuming a fault."
          runbook: "README.md#on-call"

      # Per-table, because the loop's own counters cannot say which table:
      # every sweep is fault-isolated, so one failing every hour leaves the
      # other twelve succeeding and the loop looking merely intermittent.
      - alert: SketchyRetentionSweepFailing
        expr: sketchy_retention_sweep_failed == 1
        for: 2h
        labels: {severity: warn}
        annotations:
          summary: "The {{ $labels.table }} retention sweep has been failing for two hours"
          description: "Fault isolation keeps the other sweeps running, so nothing else will show this. The exception is in the logs under 'retention sweep {{ $labels.table }} failed'."
          runbook: "README.md#on-call"

      # Budget spent on every pass for six hours. Not yet a breach - the
      # catch-up tick may still be keeping up - but it is the shape that
      # becomes one, and the fix (a bigger budget) is the same either way.
      - alert: SketchyRetentionSweepStarved
        expr: sketchy_retention_sweep_exhausted == 1
        for: 6h
        labels: {severity: warn}
        annotations:
          summary: "The {{ $labels.table }} retention sweep has spent its whole budget on every pass for six hours"
          runbook: "README.md#on-call"

      # --- integrity (#894) ----------------------------------------------------
      # A stored drawing that no longer reads back is data lost until a
      # restore, and the restore that fixes it ages out with backup
      # retention: that one pages. The audit row names the drawing.
      - alert: SketchyDrawingCorrupt
        expr: increase(sketchy_integrity_mismatches_total{check="drawings"}[1h]) > 0
        labels: {severity: page}
        annotations:
          summary: "The integrity audit found a stored drawing that does not read back"
          description: "audit_events rows of type integrity.mismatch name the turn; restore it from the newest backup that still has it before that backup ages out."
          runbook: "docs/database.md#the-integrity-audit"

      - alert: SketchyIntegrityDrift
        expr: increase(sketchy_integrity_mismatches_total{check!="drawings"}[1h]) > 0
        labels: {severity: warn}
        annotations:
          summary: "The integrity audit found {{ $labels.check }} rows that disagree with their facts"
          description: "Nothing was repaired. The audit rows name each row; the rebuild commands in docs/database.md §13 repair projections."
          runbook: "docs/database.md#the-integrity-audit"

      # An audit that never finishes a pass bounds nothing.
      - alert: SketchyIntegrityCycleOverdue
        expr: sketchy_integrity_cycle_age_seconds > 2 * sketchy_integrity_cycle_target_seconds
        for: 1h
        labels: {severity: warn}
        annotations:
          summary: "The {{ $labels.check }} integrity check has not completed a pass in twice its target"
          description: "Raise INTEGRITY_AUDIT_BYTE_BUDGET_MIB or INTEGRITY_AUDIT_PASS_SECONDS, or look for sketchy_integrity_check_failed."
          runbook: "docs/database.md#the-integrity-audit"

      - alert: SketchyMailBacklog
        expr: sketchy_mail_outbox_oldest_seconds > 600
        for: 10m
        labels: {severity: warn}
        annotations:
          summary: "The oldest undelivered message has waited {{ $value | humanizeDuration }}"
          runbook: "README.md#on-call"

      - alert: SketchyExportStuck
        expr: sketchy_data_exports_oldest_seconds > 600
        for: 10m
        labels: {severity: warn}
        annotations:
          summary: "An account export has been pending for {{ $value | humanizeDuration }}"
          runbook: "README.md#on-call"

      - alert: SketchyDiskLow
        expr: sketchy:disk_free_ratio < 0.10
        for: 10m
        labels: {severity: page}
        annotations:
          summary: "Less than 10% of the data volume is free"
          runbook: "README.md#on-call"

      - alert: SketchyMemoryHigh
        expr: sketchy_process_resident_memory_bytes > 1.5e9
        for: 15m
        labels: {severity: warn}
        annotations:
          summary: "Resident memory is over 1.5 GB ({{ $value | humanize1024 }}B)"
          description: "Sized for a single worker on a small host; adjust to the deployment. A steady climb with no load is a leak."
          runbook: "README.md#on-call"

      # --- the connection (#881) ------------------------------------------------------
      # Each is a cause a player feels as lag or a stuck canvas before any
      # objective moves: a network or proxy the deployment did not plan for.
      # The floors keep a quiet night with a handful of sockets from firing.
      - alert: SketchyPollingShareHigh
        expr: >
          sum(sketchy_sockets_by_transport{transport="polling"})
            / clamp_min(sum(sketchy_sockets_by_transport), 1) > 0.2
          and sum(sketchy_sockets_by_transport) >= 20
        for: 30m
        labels: {severity: warn}
        annotations:
          summary: "Over a fifth of open sockets are on long-polling ({{ $value | humanizePercentage }})"
          description: "Polling is the fallback for a WebSocket upgrade the network blocks or drops (#601). A share this high is usually a proxy or load balancer not passing the upgrade; each polling drawer costs several times the requests of a WebSocket one."
          runbook: "README.md#on-call"

      - alert: SketchyCompressionMissing
        expr: >
          sum(increase(sketchy_socket_transport_total{compression="none"}[30m]))
            / clamp_min(sum(increase(sketchy_socket_transport_total[30m])), 1) > 0.1
          and sum(increase(sketchy_socket_transport_total[30m])) >= 20
        labels: {severity: warn}
        annotations:
          summary: "Over a tenth of new WebSockets negotiated no compression ({{ $value | humanizePercentage }})"
          description: "Every current browser offers permessage-deflate, so connections without it are almost always a proxy stripping the extension. Uncompressed traffic is ~8x the bytes (wire §1); compare sketchy_ws_wire_bytes_out_total with sketchy_socket_bytes_out_total."
          runbook: "README.md#on-call"

      - alert: SketchyBacklogClosures
        expr: increase(sketchy_socket_backlog_closures_total[15m]) > 0
        labels: {severity: warn}
        annotations:
          summary: "A socket was closed for an outbound backlog (reason={{ $labels.reason }})"
          description: "A viewer that could not keep up with what its room sends was closed and resynced (R-RATE-11). One is a slow phone; several at once is the server's egress or a room sending too much."
          runbook: "README.md#on-call"

      - alert: SketchyCanvasRecoveries
        expr: >
          sum(increase(sketchy_canvas_recovery_notices_total{reason!="deferred"}[15m]))
            / clamp_min(sum(sketchy_sockets_connected), 1) > 0.5
          and sum(increase(sketchy_canvas_recovery_notices_total{reason!="deferred"}[15m])) >= 10
        for: 15m
        labels: {severity: warn}
        annotations:
          summary: "Canvases are being recovered at over one per two sockets per 15 minutes"
          description: "Each notice is a socket whose canvas went wrong and was repaired (wire §7). `deferred` is the resync bound working and is excluded. A sustained rate is a client or protocol bug, or a network dropping frames."
          runbook: "README.md#on-call"

      - alert: SketchyDrawingStoreLarge
        expr: sketchy_drawing_store_bytes > 50e9
        for: 1h
        labels: {severity: warn}
        annotations:
          summary: "Stored drawings are over 50 GB ({{ $value | humanize1024 }}B)"
          description: "#471 kept drawing bytes in the primary database on measured sizes, and named this as the size at which that is reopened: past here the blobs dominate backup and restore, and object storage has to be costed again. Not an incident - the store only grows - so it is a warning to act on in daylight."
          runbook: "README.md#on-call"
