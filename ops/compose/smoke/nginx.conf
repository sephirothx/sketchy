# cloudflared's part in the smoke (compose.smoke.yaml): forward everything to
# the app, name the client in X-Forwarded-For, and say the request arrived
# over HTTPS, which is what Cloudflare's edge tells cloudflared.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;

    location / {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Socket.IO's long-polling holds a request open until the server
        # has something to say, up to its ping cycle (45 s).
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
}
