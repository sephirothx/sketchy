<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f2f3f7;
      color: #1c1d21;
      font-family: system-ui, "Segoe UI", Roboto, sans-serif;
    }
    h1, h2, h3, p, ul { margin: 0; }
    a { color: #4c6ef5; text-decoration: none; }
    a:hover { color: #3b5bdb; }
  </style>
</helmet>
<div style="width: 1000px; min-height: 1000px; margin: 0 auto; padding: 24px 16px 64px">
  <div>

    <header style="align-items: center; display: flex; justify-content: space-between; margin-bottom: 16px">
      <a href="#" style="background: transparent; border: 0; color: #2563eb; font-size: 14px; font-weight: 700; margin: 0; padding: 0">← Lobby</a>
      <button type="button" style="display: inline-flex; align-items: center; gap: 8px; border: 1px solid #cbd5e1; background: transparent; color: inherit; border-radius: 999px; padding: 4px 12px 4px 4px; min-height: 36px; font: inherit">
        <span style="display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 50%; background: #0f766e; color: #fff; font-weight: 700; font-size: 14px; flex: none">M</span>
        <span style="font-weight: 600; font-size: 14px">Marta</span>
      </button>
    </header>

    <section style="background: #fff; border: 1px solid #dfe1e6; border-radius: 10px; padding: 16px 20px">
      <div style="align-items: center; display: flex; justify-content: space-between; gap: 16px">
        <div>
          <p style="color: #64748b; font-size: 12px; font-weight: 700; letter-spacing: .07em; margin: 0 0 4px; text-transform: uppercase">Your library</p>
          <h1 style="margin: 0; font-size: 32px; font-weight: 700">Reusable prompt lists</h1>
        </div>
        <button type="button" style="background: #4c6ef5; border: 0; border-radius: 6px; color: #fff; font-size: 15px; font-weight: 600; padding: 10px 16px; font-family: inherit">New list</button>
      </div>

      <div style="display: grid; gap: 24px; grid-template-columns: minmax(180px, 240px) minmax(0, 1fr); margin-top: 24px">

        <aside style="display: grid; gap: 8px; align-content: start">
          <button type="button" style="background: #eef2ff; border: 1px solid #818cf8; border-radius: 6px; color: #334155; display: flex; flex-direction: column; gap: 3px; text-align: left; font-size: 15px; font-weight: 600; padding: 10px 16px; font-family: inherit">
            <strong>Studio in-jokes</strong>
            <span style="color: #64748b; font-size: 12px">64 prompts · private</span>
          </button>
          <button type="button" style="background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px; color: #334155; display: flex; flex-direction: column; gap: 3px; text-align: left; font-size: 15px; font-weight: 600; padding: 10px 16px; font-family: inherit">
            <strong>Kitchen things</strong>
            <span style="color: #64748b; font-size: 12px">120 prompts · unlisted</span>
          </button>
          <button type="button" style="background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px; color: #334155; display: flex; flex-direction: column; gap: 3px; text-align: left; font-size: 15px; font-weight: 600; padding: 10px 16px; font-family: inherit">
            <strong>Hard mode</strong>
            <span style="color: #64748b; font-size: 12px">38 prompts · private · under review</span>
          </button>
        </aside>

        <form style="display: grid; gap: 12px">
          <label style="display: grid; gap: 4px; font-size: 14px; font-weight: 600">Name
            <input value="Studio in-jokes" style="border: 1px solid #c7cad1; border-radius: 6px; font: inherit; font-size: 15px; font-weight: normal; padding: 8px 10px; width: 100%">
          </label>
          <label style="display: grid; gap: 4px; font-size: 14px; font-weight: 600">Description
            <input value="Things only this team would draw" style="border: 1px solid #c7cad1; border-radius: 6px; font: inherit; font-size: 15px; font-weight: normal; padding: 8px 10px; width: 100%">
          </label>

          <div style="display: grid; gap: 12px; grid-template-columns: 1fr 1fr">
            <label style="display: grid; gap: 4px; font-size: 14px; font-weight: 600">Language
              <select style="border: 1px solid #c7cad1; border-radius: 6px; font: inherit; font-size: 15px; font-weight: normal; padding: 8px 10px; width: 100%; background: #fff; color: #1c1d21">
                <option>English</option>
              </select>
            </label>
            <label style="display: grid; gap: 4px; font-size: 14px; font-weight: 600">Visibility
              <select style="border: 1px solid #c7cad1; border-radius: 6px; font: inherit; font-size: 15px; font-weight: normal; padding: 8px 10px; width: 100%; background: #fff; color: #1c1d21">
                <option>Private</option>
                <option>Anyone with code</option>
              </select>
            </label>
          </div>

          <div style="border-top: 1px solid #e2e8f0; display: grid; gap: 8px; margin-top: 18px; padding-top: 16px">
            <label style="font-size: 14px; font-weight: 600">Add prompts</label>
            <textarea placeholder="One prompt per line
or separate entries with commas" style="border: 1px solid #c7cad1; border-radius: 6px; font: inherit; font-size: 15px; font-weight: normal; padding: 8px 10px; width: 100%; display: block; height: 110px; resize: vertical"></textarea>
            <div style="align-items: center; display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between">
              <p style="color: #475569; font-size: 13px; margin: 0">64 of 500 prompts in this list</p>
              <button type="button" style="background: #4c6ef5; border: 0; border-radius: 6px; color: #fff; font-size: 15px; font-weight: 600; padding: 10px 16px; font-family: inherit; opacity: .55">Add to list</button>
            </div>
          </div>

          <div style="border-top: 1px solid #e2e8f0; display: grid; gap: 10px; margin-top: 18px; padding-top: 16px">
            <div style="align-items: center; display: flex; flex-wrap: wrap; gap: 10px">
              <h3 style="font-size: 14px; font-weight: 600; margin: 0">In this list</h3>
              <input type="search" placeholder="Search prompts" style="flex: 1 1 200px; padding: 6px 10px; width: auto; border: 1px solid #c7cad1; border-radius: 6px; font: inherit; font-size: 15px; font-weight: normal">
              <label style="align-items: center; color: #b45309; display: flex; font-size: 13px; font-weight: 700; gap: 6px; white-space: nowrap">
                <input type="checkbox" style="width: auto">
                Needs review (1)
              </label>
              <span style="color: #64748b; font-size: 12px; margin-left: auto; white-space: nowrap">64 prompts</span>
            </div>

            <ul style="display: flex; flex-wrap: wrap; gap: 6px; list-style: none; margin: 0; max-height: 320px; overflow: auto; padding: 0 4px 0 0">
              <li style="align-items: center; background: #f1f5f9; border: 1px solid #e2e8f0; border-radius: 999px; display: flex; font-size: 14px; gap: 2px; max-width: 100%; padding: 3px 3px 3px 12px">
                <span style="min-width: 0; overflow-wrap: anywhere">the good stapler</span>
                <button type="button" aria-label="Remove the good stapler" style="background: none; border: 0; border-radius: 999px; color: #64748b; font-size: 16px; line-height: 1; padding: 3px 8px; font-family: inherit">×</button>
              </li>
              <li style="align-items: center; background: #f1f5f9; border: 1px solid #e2e8f0; border-radius: 999px; display: flex; font-size: 14px; gap: 2px; max-width: 100%; padding: 3px 3px 3px 12px">
                <span style="min-width: 0; overflow-wrap: anywhere">friday deploy</span>
                <button type="button" aria-label="Remove friday deploy" style="background: none; border: 0; border-radius: 999px; color: #64748b; font-size: 16px; line-height: 1; padding: 3px 8px; font-family: inherit">×</button>
              </li>
              <li style="align-items: center; background: #f1f5f9; border: 1px solid #e2e8f0; border-radius: 999px; display: flex; font-size: 14px; gap: 2px; max-width: 100%; padding: 3px 3px 3px 12px">
                <span style="min-width: 0; overflow-wrap: anywhere">the office plant</span>
                <button type="button" aria-label="Remove the office plant" style="background: none; border: 0; border-radius: 999px; color: #64748b; font-size: 16px; line-height: 1; padding: 3px 8px; font-family: inherit">×</button>
              </li>
              <li style="align-items: center; background: #fff7ed; border: 1px solid #fdba74; border-radius: 999px; display: flex; font-size: 14px; gap: 2px; max-width: 100%; padding: 3px 3px 3px 12px">
                <span style="min-width: 0; overflow-wrap: anywhere">the incident</span>
                <span style="align-self: center; color: #b91c1c; font-weight: 800; text-transform: capitalize">under review</span>
                <button type="button" aria-label="Remove the incident" style="background: none; border: 0; border-radius: 999px; color: #64748b; font-size: 16px; line-height: 1; padding: 3px 8px; font-family: inherit">×</button>
              </li>
              <li style="align-items: center; background: #f1f5f9; border: 1px solid #e2e8f0; border-radius: 999px; display: flex; font-size: 14px; gap: 2px; max-width: 100%; padding: 3px 3px 3px 12px">
                <span style="min-width: 0; overflow-wrap: anywhere">standup bingo</span>
                <button type="button" aria-label="Remove standup bingo" style="background: none; border: 0; border-radius: 999px; color: #64748b; font-size: 16px; line-height: 1; padding: 3px 8px; font-family: inherit">×</button>
              </li>
              <li style="align-items: center; background: #f1f5f9; border: 1px solid #e2e8f0; border-radius: 999px; display: flex; font-size: 14px; gap: 2px; max-width: 100%; padding: 3px 3px 3px 12px">
                <span style="min-width: 0; overflow-wrap: anywhere">the whiteboard nobody erases</span>
                <button type="button" aria-label="Remove the whiteboard nobody erases" style="background: none; border: 0; border-radius: 999px; color: #64748b; font-size: 16px; line-height: 1; padding: 3px 8px; font-family: inherit">×</button>
              </li>
              <li style="align-items: center; background: #f1f5f9; border: 1px solid #e2e8f0; border-radius: 999px; display: flex; font-size: 14px; gap: 2px; max-width: 100%; padding: 3px 3px 3px 12px">
                <span style="min-width: 0; overflow-wrap: anywhere">coffee machine queue</span>
                <button type="button" aria-label="Remove coffee machine queue" style="background: none; border: 0; border-radius: 999px; color: #64748b; font-size: 16px; line-height: 1; padding: 3px 8px; font-family: inherit">×</button>
              </li>
              <li style="align-items: center; background: #f1f5f9; border: 1px solid #e2e8f0; border-radius: 999px; display: flex; font-size: 14px; gap: 2px; max-width: 100%; padding: 3px 3px 3px 12px">
                <span style="min-width: 0; overflow-wrap: anywhere">rubber duck</span>
                <button type="button" aria-label="Remove rubber duck" style="background: none; border: 0; border-radius: 999px; color: #64748b; font-size: 16px; line-height: 1; padding: 3px 8px; font-family: inherit">×</button>
              </li>
            </ul>
          </div>

          <div style="align-items: center; display: flex; gap: 10px; justify-content: space-between">
            <button type="button" style="background: #fff; border: 1px solid #ef4444; border-radius: 6px; color: #b91c1c; font-size: 15px; font-weight: 600; padding: 10px 16px; font-family: inherit">Delete</button>
            <button type="submit" style="background: #4c6ef5; border: 0; border-radius: 6px; color: #fff; font-size: 15px; font-weight: 600; padding: 10px 16px; font-family: inherit">Save list</button>
          </div>
        </form>
      </div>
    </section>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview": {"width": 1000, "height": 1000}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
