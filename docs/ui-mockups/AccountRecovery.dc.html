<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f2f3f7;
      color: #1c1d21;
      font-family: system-ui, "Segoe UI", Roboto, sans-serif;
    }
    h1, h2, h3, p { margin: 0; }
    a { color: #4c6ef5; text-decoration: none; }
    a:hover { color: #3b5bdb; }
  </style>
</helmet>
<div style="width: 560px; min-height: 440px; display: flex; justify-content: center; padding: 48px 16px">
  <div style="background: #fff; border: 1px solid #dfe1e6; border-radius: 12px; max-width: 420px; padding: 24px; width: 100%">
    <h1 style="font-size: 20px; margin: 0 0 8px; font-weight: 700">Reset your password</h1>

    <form style="display: flex; flex-direction: column; gap: 6px; text-align: left; margin-top: 12px">
      <p style="font-size: 14px; margin: 0 0 12px">Enter your username or your confirmed email address. If the account can be recovered, a link is on its way.</p>
      <label style="font-size: 13px; font-weight: 600">Username or email</label>
      <input style="border: 1px solid #cbd5e1; border-radius: 8px; padding: 10px 12px; font-size: 16px; background: #fff; color: #0f172a; font-family: inherit">
      <button type="submit" style="background: #4c6ef5; color: #ffffff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 0.95rem; font-weight: 600; margin-top: 10px; font-family: inherit">Send a reset link</button>
    </form>

    <p style="font-size: 13px; margin: 12px 0 0">
      <a href="#" style="border: none; background: none; padding: 0; color: #4f46e5; font: inherit; font-weight: 600; text-decoration: underline">Back to the lobby</a>
    </p>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview": {"width": 560, "height": 440}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
