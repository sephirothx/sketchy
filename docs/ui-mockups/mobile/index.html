<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sketchy Mobile Redesign</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito+Sans:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap">

<style>
/* ═══════════════════════════════════════════════════════════════════
   VIEWER SHELL — its own identity: a cool drafting bench, so the warm
   paper of the mockups reads as a separate object sitting on it.
   ═══════════════════════════════════════════════════════════════════ */
:root{
  --bg:#e6e3dc; --bg-2:#dbd7ce; --panel:#fdfcfa; --panel-2:#f2efe9;
  --ink:#191817; --ink-2:#5d584f; --ink-3:#8a8378;
  --rule:#d3cec4; --rule-2:#bcb5a7;
  --accent:#a8451a; --accent-soft:#f2e0d6; --accent-line:#d9a184;
  --bad:#a5231c; --bad-soft:#f6e2e0;
  --ok:#2b6e40; --ok-soft:#dfeee3;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --ui:"Nunito Sans","Segoe UI",system-ui,sans-serif;
  --disp:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --shadow-frame:0 30px 70px rgba(28,22,12,.28);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1014; --bg-2:#141821; --panel:#181b22; --panel-2:#20242d;
    --ink:#ecebe7; --ink-2:#9ba1ac; --ink-3:#6b7280;
    --rule:#282d36; --rule-2:#39404c;
    --accent:#e08a4e; --accent-soft:rgba(224,138,78,.13); --accent-line:rgba(224,138,78,.42);
    --bad:#ef8078; --bad-soft:rgba(239,128,120,.13);
    --ok:#63c185; --ok-soft:rgba(99,193,133,.13);
    --shadow-frame:0 30px 70px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#0e1014; --bg-2:#141821; --panel:#181b22; --panel-2:#20242d;
  --ink:#ecebe7; --ink-2:#9ba1ac; --ink-3:#6b7280;
  --rule:#282d36; --rule-2:#39404c;
  --accent:#e08a4e; --accent-soft:rgba(224,138,78,.13); --accent-line:rgba(224,138,78,.42);
  --bad:#ef8078; --bad-soft:rgba(239,128,120,.13);
  --ok:#63c185; --ok-soft:rgba(99,193,133,.13);
  --shadow-frame:0 30px 70px rgba(0,0,0,.6);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink); font-family:var(--ui);
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
  min-height:100dvh;
}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* ── masthead ─────────────────────────────────────────────────── */
.mast{
  position:sticky; top:0; z-index:40; background:var(--bg);
  border-bottom:1px solid var(--rule);
  display:flex; align-items:center; gap:18px; padding:14px 22px;
}
.mast h1{
  font-family:var(--disp); font-weight:600; font-size:19px; margin:0;
  letter-spacing:-.01em; white-space:nowrap;
}
.mast h1 em{font-style:normal;color:var(--accent)}
.mast .sub{
  font-family:var(--mono); font-size:11px; color:var(--ink-3);
  letter-spacing:.02em; white-space:nowrap;
}
.mast-sp{flex:1}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.tbtn{
  background:var(--panel); border:1px solid var(--rule); border-radius:9px;
  padding:7px 12px; font-size:12.5px; font-weight:800; cursor:pointer;
  display:inline-flex; align-items:center; gap:7px; white-space:nowrap;
}
.tbtn:hover{border-color:var(--rule-2)}
.tbtn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.seg{display:flex;background:var(--panel);border:1px solid var(--rule);border-radius:9px;overflow:hidden}
.seg button{
  background:none;border:0;padding:7px 11px;font-size:12.5px;font-weight:800;
  cursor:pointer;color:var(--ink-2)
}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}

/* ── two-column bench ─────────────────────────────────────────── */
.bench{display:grid;grid-template-columns:262px minmax(0,1fr);align-items:start}
.rail{
  position:sticky; top:57px; height:calc(100dvh - 57px); overflow:auto;
  border-right:1px solid var(--rule); padding:16px 12px 40px; background:var(--bg);
}
.rail h2{
  font-family:var(--mono); font-size:10px; font-weight:700; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-3); margin:18px 8px 7px;
}
.rail h2:first-child{margin-top:2px}
.rail a{
  display:flex; align-items:baseline; gap:9px; padding:7px 9px; border-radius:8px;
  text-decoration:none; font-size:13.5px; font-weight:700; color:var(--ink-2);
  border:1px solid transparent; cursor:pointer;
}
.rail a:hover{background:var(--panel-2);color:var(--ink)}
.rail a.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line)}
.rail a .n{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);min-width:22px}
.rail a.on .n{color:var(--accent)}
.rail .alt{margin-left:22px;font-size:12.5px;font-weight:600;opacity:.9}

.stage{padding:26px 30px 90px;min-width:0}

/* ── screen header ────────────────────────────────────────────── */
.shead{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:6px}
.shead .eyebrow{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--accent);font-weight:700
}
.shead h2{font-family:var(--disp);font-weight:600;font-size:30px;margin:2px 0 0;letter-spacing:-.015em;text-wrap:balance}
.lede{color:var(--ink-2);max-width:62ch;margin:10px 0 0;font-size:15px}
.vtabs{display:flex;gap:7px;margin:18px 0 0;flex-wrap:wrap}
.vtab{
  background:var(--panel);border:1px solid var(--rule);border-radius:999px;
  padding:6px 14px;font-size:12.5px;font-weight:800;cursor:pointer;color:var(--ink-2)
}
.vtab[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.vtab .ships{
  font-family:var(--mono);font-size:9.5px;font-style:normal;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ok);margin-left:5px
}
.vtab[aria-pressed="true"] .ships{color:var(--bg);opacity:.72}
.verdict{
  font-family:var(--mono);font-size:11.5px;color:var(--ink-3);
  margin:20px 0 0;letter-spacing:.02em
}

/* ── phone deck ───────────────────────────────────────────────── */
.deck{display:flex;gap:34px;flex-wrap:wrap;margin:26px 0 0;align-items:flex-start}
.slot{display:flex;flex-direction:column;gap:11px;align-items:center}
.slot .cap{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-3);font-weight:700
}
.fitbox{position:relative}
.frame{
  width:390px;height:844px;border-radius:46px;position:relative;overflow:hidden;
  transform-origin:top left;
  box-shadow:0 0 0 10px #16181d,0 0 0 12px #3b414b,var(--shadow-frame);
}
.frame.land{width:844px;height:390px;border-radius:44px}

/* ── critique ─────────────────────────────────────────────────── */
.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;margin:34px 0 0;max-width:1120px}
.note{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:16px 18px}
.note h3{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;
  margin:0 0 11px;font-weight:700;display:flex;align-items:center;gap:8px
}
.note.bad h3{color:var(--bad)}
.note.good h3{color:var(--ok)}
.note h3::before{content:"";width:9px;height:9px;border-radius:3px;background:currentColor}
.note ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.note li{font-size:13.5px;line-height:1.5;color:var(--ink-2);padding-left:15px;position:relative}
.note li::before{content:"";position:absolute;left:0;top:8px;width:6px;height:1.5px;background:var(--rule-2)}
.note li b{color:var(--ink);font-weight:800}
.note code, .m{
  font-family:var(--mono);font-size:11.5px;background:var(--panel-2);
  border:1px solid var(--rule);border-radius:5px;padding:1px 5px;color:var(--ink);
  font-variant-numeric:tabular-nums;white-space:nowrap
}

.pager{display:flex;gap:10px;margin:38px 0 0;align-items:center}
.pager .sp{flex:1}

@media (max-width:1000px){
  .bench{grid-template-columns:1fr}
  .rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--rule);
        display:flex;gap:6px;overflow-x:auto;padding:10px 14px}
  .rail h2{display:none}
  .rail a{white-space:nowrap}
  .rail .alt{margin-left:0}
  .stage{padding:20px 16px 70px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ═══════════════════════════════════════════════════════════════════
   MOCKUP TOKENS — copied verbatim from frontend/src/styles/theme.css
   so the mockups are the shipped palette, not an approximation.
   ═══════════════════════════════════════════════════════════════════ */
.ph{
  --paper:#faf6ef; --well:#faf6ef; --card:#ffffff; --field:#ffffff; --track:#f1ebe0;
  --scrim:rgba(30,27,22,.5);
  --ink:#292520; --muted:#6f6759; --faint:#a29883;
  --line:#e7dfd2; --line-strong:#d3c8b4;
  --avatar-ink:#fff; --guest-avatar:#5b6472; --guest-bg:#f0eadd;
  --primary:#5157d8; --primary-soft:#eeeffb; --primary-ink:#3b41b5; --primary-edge:#3b41b5;
  --warm:#e8703a; --warm-soft:#fbeadf; --warm-ink:#b5541f; --warm-edge:#c1521f;
  --success:#2f9e44; --success-soft:#e7f5ea; --success-ink:#1f7a33;
  --success-button:#2f9e44; --success-button-edge:#247c34;
  --warning:#b45309; --warning-soft:#fdf1dc; --warning-edge:#ebc98a;
  --danger:#c92a2a; --danger-soft:#fbecec;
  --gold:#8a6d0b; --silver:#5a6472; --bronze:#8a5a2e;
  --brand-wordmark:#3d2b1f; --brand-ferrule:#75726d;
  --shadow:0 1px 2px rgba(20,16,10,.06); --shadow-raised:0 10px 30px rgba(20,16,10,.14);
  --os:#f3efe8; --os-ink:#292520; --kb:#d3d0cb; --kbkey:#ffffff; --kbink:#111;
}
.ph[data-t="dark"]{
  --paper:#0f172a; --well:rgba(2,6,23,.35); --card:#1e293b; --field:#0f172a; --track:rgba(2,6,23,.45);
  --scrim:rgba(2,6,23,.6);
  --ink:#f8fafc; --muted:#94a3b8; --faint:#64748b;
  --line:#334155; --line-strong:#475569;
  --avatar-ink:#132036; --guest-avatar:#c3cbd8; --guest-bg:rgba(148,163,184,.18);
  --primary:#666ce4; --primary-soft:rgba(102,108,228,.17); --primary-ink:#c7cbfa; --primary-edge:#3b41b5;
  --warm:#ee7e48; --warm-soft:rgba(238,126,72,.15); --warm-ink:#fdba74; --warm-edge:#9a3412;
  --success:#4ade80; --success-soft:rgba(74,222,128,.13); --success-ink:#86efac;
  --warning:#fbbf24; --warning-soft:rgba(251,191,36,.13); --warning-edge:rgba(251,191,36,.4);
  --danger:#f87171; --danger-soft:rgba(248,113,113,.14);
  --gold:#f5ce62; --silver:#b9c4d4; --bronze:#dfa878;
  --brand-wordmark:#f8fafc; --brand-ferrule:#94a3b8;
  --shadow:0 1px 2px rgba(0,0,0,.24); --shadow-raised:0 10px 30px rgba(0,0,0,.4);
  --os:#0b1220; --os-ink:#f8fafc; --kb:#1c1f26; --kbkey:#3a3f49; --kbink:#fff;
}

/* ── mockup base ──────────────────────────────────────────────── */
.ph{
  width:100%;height:100%;background:var(--paper);color:var(--ink);
  font-family:"Nunito Sans",system-ui,sans-serif;font-size:14px;line-height:1.4;
  display:flex;flex-direction:column;position:relative;overflow:hidden;
}
.ph *{box-sizing:border-box}
.ph .disp{font-family:"Fredoka",system-ui,sans-serif;font-weight:600}

/* OS chrome */
.osbar{
  height:46px;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:0 26px 0 30px;font-size:13.5px;font-weight:800;color:var(--ink);
  font-variant-numeric:tabular-nums;letter-spacing:.01em;
}
.osbar .r{display:flex;align-items:center;gap:5px;opacity:.85}
.homebar{
  flex:0 0 auto;height:22px;display:flex;align-items:center;justify-content:center;
}
.homebar i{display:block;width:134px;height:5px;border-radius:3px;background:var(--ink);opacity:.34}

/* app shell: the fixed three-band contract */
.app{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.band{flex:0 0 auto}
.stagearea{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.dock{
  flex:0 0 auto;background:var(--card);border-top:1.5px solid var(--line);
  padding:10px 14px 12px;display:flex;flex-direction:column;gap:9px;
  box-shadow:0 -6px 18px rgba(20,16,10,.05);
}
.ph[data-t="dark"] .dock{box-shadow:0 -6px 18px rgba(0,0,0,.32)}

/* status band */
.sband{
  height:56px;display:flex;align-items:center;gap:10px;padding:0 12px;
  border-bottom:1.5px solid var(--line);background:var(--card);
}
.codechip{
  font-family:"JetBrains Mono",monospace;font-size:12px;font-weight:700;letter-spacing:.1em;
  background:var(--well);border:1.5px solid var(--line);border-radius:9px;padding:6px 9px;color:var(--muted);
}
.ph[data-t="dark"] .codechip{background:rgba(2,6,23,.4)}
.sb-sp{flex:1}
.iconbtn{
  width:44px;height:44px;border-radius:13px;border:1.5px solid var(--line);background:var(--card);
  display:flex;align-items:center;justify-content:center;color:var(--muted);flex:0 0 auto;
}
.iconbtn.ghost{border-color:transparent;background:transparent}
.dots{display:flex;flex-direction:column;gap:3px;align-items:center}
.dots i{width:4px;height:4px;border-radius:50%;background:currentColor;display:block}

/* timer ring */
.ring{position:relative;width:46px;height:46px;flex:0 0 auto}
.ring svg{display:block;transform:rotate(-90deg)}
.ring b{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:900;font-variant-numeric:tabular-nums;color:var(--warm-ink);
  letter-spacing:-.02em;
}
.ring.urgent b{color:var(--danger)}

/* generic bits */
.av{
  width:34px;height:34px;border-radius:50%;background:var(--guest-bg);color:var(--guest-avatar);
  display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;flex:0 0 auto;
}
.av.p{background:var(--primary);color:#fff}
.av.w{background:var(--warm);color:#fff}
.av.g{background:var(--success-button);color:#fff}
.av.sm{width:26px;height:26px;font-size:11px}
.av.lg{width:56px;height:56px;font-size:22px}
.btn{
  border:0;border-radius:14px;background:var(--primary);color:#fff;font-weight:900;font-size:16px;
  min-height:52px;display:flex;align-items:center;justify-content:center;gap:9px;
  box-shadow:0 3px 0 var(--primary-edge);width:100%;padding:0 16px;
}
.btn.go{background:var(--success-button);box-shadow:0 3px 0 var(--success-button-edge)}
.btn.ghost{
  background:var(--card);color:var(--ink);border:1.5px solid var(--line-strong);box-shadow:none;
}
.btn.sm{min-height:44px;font-size:14px;border-radius:12px}
.linkbtn{
  background:none;border:0;color:var(--muted);font-weight:800;font-size:13.5px;
  min-height:44px;display:flex;align-items:center;justify-content:center;width:100%;
}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px}
.kick{
  font-size:10.5px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);
}
.muted{color:var(--muted)}
.faint{color:var(--faint)}

/* the drawing surface */
.canvas{
  width:100%;aspect-ratio:4/3;background:#fff;border:1.5px solid var(--line-strong);
  border-radius:14px;overflow:hidden;position:relative;flex:0 0 auto;color:#2b2b2b;
}
.canvas svg{width:100%;height:100%;display:block}
/* Keyboard-open layouts: the canvas takes the height that is left and keeps
   4:3 by giving up width, exactly like the shipped guess-focused rule. */
.canvasfit{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.canvasfit>.canvas{height:100%;width:auto;max-width:100%;flex:0 0 auto;border-left:1.5px solid var(--line-strong);border-right:1.5px solid var(--line-strong);border-radius:10px}
.canvas .zoom{
  position:absolute;right:8px;bottom:8px;width:36px;height:36px;border-radius:11px;
  background:rgba(255,255,255,.92);border:1.5px solid #d3c8b4;display:flex;
  align-items:center;justify-content:center;color:#6f6759;
}

/* masked word tiles */
.tiles{display:flex;align-items:flex-start;gap:5px;justify-content:center;flex-wrap:wrap}
.tile{
  width:29px;height:38px;border-radius:9px;background:var(--card);border:2px solid var(--line-strong);
  display:flex;align-items:center;justify-content:center;font-family:"Fredoka",sans-serif;
  font-weight:600;font-size:19px;color:var(--ink);flex:0 0 auto;
}
.tile.on{background:var(--primary-soft);border-color:var(--primary);color:var(--primary-ink)}
.tile.buy{border-style:dashed;border-color:var(--primary);color:var(--primary);height:44px}
.tile.sm{width:24px;height:32px;font-size:16px;border-radius:8px}
.wcount{
  font-size:11px;font-weight:900;color:var(--faint);font-variant-numeric:tabular-nums;
  align-self:center;margin-left:2px
}

/* the depleting rule (keyboard mode) */
.timerule{height:5px;border-radius:3px;background:var(--track);overflow:hidden;flex:0 0 auto}
.timerule i{display:block;height:100%;border-radius:3px;background:var(--warm)}
.timerule.urgent i{background:var(--danger)}

/* guessed pips — the live race state */
.pips{display:flex;align-items:center;gap:6px;flex:0 0 auto;min-height:30px}
.pip{
  width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:900;position:relative;flex:0 0 auto;
}
.pip.got{background:var(--success-soft);color:var(--success-ink);border:2px solid var(--success)}
.pip.wait{background:var(--well);color:var(--faint);border:2px dashed var(--line-strong)}
.ph[data-t="dark"] .pip.wait{background:rgba(2,6,23,.4)}
.pip .rk{
  position:absolute;right:-3px;bottom:-3px;width:14px;height:14px;border-radius:50%;
  background:var(--success);color:#fff;font-size:8.5px;display:flex;align-items:center;
  justify-content:center;font-weight:900;border:1.5px solid var(--card)
}
.pipmeta{font-size:12px;font-weight:800;color:var(--muted);margin-left:auto;font-variant-numeric:tabular-nums}

/* one-line live ticker */
.ticker{
  display:flex;align-items:center;gap:7px;min-height:26px;font-size:13px;font-weight:700;
  color:var(--muted);overflow:hidden;white-space:nowrap;flex:0 0 auto;
}
.ticker .ok{color:var(--success-ink);font-weight:900}
.ticker .nm{color:var(--ink);font-weight:900;font-style:italic}

/* guess input */
.guessrow{display:flex;gap:9px;align-items:center}
.gfield{
  flex:1;min-height:52px;border-radius:14px;border:2px solid var(--line-strong);background:var(--field);
  display:flex;align-items:center;padding:0 14px;font-size:16px;color:var(--faint);font-weight:600;
}
.gfield.focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.gfield .caret{width:2px;height:20px;background:var(--primary);margin-left:1px}
.gsend{
  width:52px;height:52px;border-radius:14px;background:var(--primary);color:#fff;display:flex;
  align-items:center;justify-content:center;flex:0 0 auto;box-shadow:0 3px 0 var(--primary-edge);
}
.verdict{
  border-radius:11px;padding:7px 12px;font-size:13px;font-weight:800;display:flex;
  align-items:center;gap:8px;flex:0 0 auto;
}
.verdict.close{background:var(--warning-soft);border:1.5px solid var(--warning-edge);color:var(--warning)}
.verdict.hit{background:var(--success-soft);border:1.5px solid var(--success);color:var(--success-ink)}

/* drawing dock */
.swatches{display:flex;gap:8px;align-items:center;overflow:hidden}
.sw{width:38px;height:38px;border-radius:50%;flex:0 0 auto;border:2px solid rgba(0,0,0,.10)}
.ph[data-t="dark"] .sw{border-color:rgba(255,255,255,.16)}
.sw.on{box-shadow:0 0 0 3px var(--card),0 0 0 5.5px var(--primary);border-color:transparent}
.toolrow{display:flex;gap:8px;align-items:center}
.tool{
  height:48px;min-width:48px;border-radius:14px;border:1.5px solid var(--line-strong);background:var(--card);
  display:flex;align-items:center;justify-content:center;gap:6px;color:var(--muted);flex:0 0 auto;
  font-weight:900;font-size:13px;padding:0 11px;
}
.tool.on{background:var(--primary-soft);border-color:var(--primary);color:var(--primary-ink)}
.tool.danger{color:var(--danger);border-color:var(--danger-soft)}
.tool.wide{flex:1}

/* bottom sheet */
.sheet{
  position:absolute;left:0;right:0;bottom:0;background:var(--card);
  border-top:1.5px solid var(--line);border-radius:26px 26px 0 0;
  box-shadow:0 -14px 40px rgba(20,16,10,.20);padding:10px 16px 16px;
  display:flex;flex-direction:column;gap:12px;z-index:8;
}
.ph[data-t="dark"] .sheet{box-shadow:0 -14px 40px rgba(0,0,0,.5)}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line-strong);margin:2px auto 4px;flex:0 0 auto}
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:7}

/* list rows (settings, players) */
.rows{display:flex;flex-direction:column;background:var(--card);border-radius:16px;border:1.5px solid var(--line);overflow:hidden}
.row{display:flex;align-items:center;gap:11px;padding:0 14px;min-height:54px;border-top:1.5px solid var(--line)}
.row:first-child{border-top:0}
.row .lbl{font-weight:800;font-size:14.5px}
.row .val{margin-left:auto;color:var(--muted);font-weight:700;font-size:14px;display:flex;align-items:center;gap:7px}
.sw-toggle{width:48px;height:29px;border-radius:999px;background:var(--line-strong);position:relative;flex:0 0 auto}
.sw-toggle i{position:absolute;top:3px;left:3px;width:23px;height:23px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw-toggle.on{background:var(--primary)}
.sw-toggle.on i{left:22px}

/* chips */
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{
  border:1.5px solid var(--line);background:var(--well);border-radius:999px;padding:7px 12px;
  font-size:12.5px;font-weight:800;color:var(--muted);min-height:36px;display:flex;align-items:center;gap:6px
}
.ph[data-t="dark"] .chip{background:rgba(2,6,23,.35)}
.chip.on{background:var(--primary-soft);border-color:var(--primary);color:var(--primary-ink)}
.chip.warm{background:var(--warm-soft);border-color:var(--warm-edge);color:var(--warm-ink)}

/* segmented */
.segm{display:flex;background:var(--well);border:1.5px solid var(--line);border-radius:14px;padding:3px;gap:3px}
.ph[data-t="dark"] .segm{background:rgba(2,6,23,.35)}
.segm b{
  flex:1;text-align:center;padding:10px 6px;border-radius:11px;font-size:13.5px;font-weight:800;
  color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px;min-height:44px
}
.segm b.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}

.step .k{font-weight:800;font-size:14.5px;flex:1}
.step .k small{display:block;font-weight:600;font-size:11.5px;color:var(--faint)}
.step .pm{

.krow{display:flex;justify-content:center;gap:6px;margin-bottom:12px}
.krow:last-child{margin-bottom:0}
.key{

    </div>
    <span class="btn sm" style="width:auto;padding:0 18px;min-height:44px">Join</span>
  </div>`;

/* The shipped public room card: name + flag on one line, a facts row whose
   player count is the control that opens the roster, then Join and Spectate. */
const roomCard = (name, flag, n, max, rounds, secs, state) => `
  <div class="card" style="padding:12px 13px;display:flex;flex-direction:column;gap:10px">
    <div style="display:flex;align-items:center;gap:7px;min-width:0">

      <span style="font-size:15px;line-height:1">${flag}</span>

    <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
      <span class="chip" style="min-height:26px;padding:2px 9px;font-size:12px;font-weight:800;gap:5px">${ic.users}${n}/${max} ${ic.chevdown}</span>
      <span class="muted" style="font-size:12px;font-weight:700">${rounds} rounds</span>
      <span class="muted" style="font-size:12px;font-weight:700">${secs}s</span>
      ${state?`<span class="chip warm" style="min-height:22px;padding:2px 8px;font-size:10.5px">${state}</span>`:''}
    </div>
    <div style="display:flex;gap:8px">
      <span class="btn sm" style="flex:1;min-height:44px">Join</span>
      <span class="btn ghost sm" style="flex:1;min-height:44px;border:1.5px solid var(--line-strong);background:var(--card)">Spectate</span>
    </div>
  </div>`;


/* ───────────────── 01 · FIRST LANDING (no account, no name) ───────────────── */
S({ id:'firstrun', n:'01', group:'Arriving', title:'First landing',
  lede:'Someone who has never played, opening the site cold. They have not seen the game, they have no account, and they have not chosen a name. The first thing the screen used to ask them was which kind of account they would like.',
  variants:[
  { name:'A · Name and go', ships:true,

  { name:'B · Browse first',

    good:[

<script>
/* palette shown permanently in the drawer dock */
const PAL = ['#111111','#ffffff','#9aa0a6','#c92a2a','#e8703a','#f5c518','#2f9e44','#1971c2','#7048e8','#c2255c','#8a5a2e','#0ca678'];
const swatches = (on=0, from=0, to=6) => PAL.slice(from,to).map((c,i)=>
  `<span class="sw${(i+from)===on?' on':''}" style="background:${c}"></span>`).join('');

/* the masked word, grouped and counted */
const tiles = (word, revealed, cls='') => {
  const t = word.split('').map((ch,i)=>{
    const on = revealed.includes(i);
    return `<span class="tile ${cls}${on?' on':''}">${on?ch:''}</span>`;
  }).join('');
  return `<span style="display:flex;align-items:center;gap:5px">${t}<span class="wcount">${word.length}</span></span>`;
};

const feedLine = (who,txt,kind) =>
  `<div class="ticker" style="min-height:24px">${
    kind==='ok' ? `<span class="nm">${who}</span><span class="ok">got it · ${txt}</span>`
    : kind==='sys' ? `<span class="faint" style="font-weight:700">${txt}</span>`
    : `<span class="nm">${who}</span><span style="color:var(--ink);font-weight:600">${txt}</span>`}</div>`;

</script>
<script>
/* ═══════════════════ VIEWER ═══════════════════ */
let cur = 0, curVar = 0, mode = 'both';

const railEl = document.getElementById('rail');
const stageEl = document.getElementById('stage');
const crumbEl = document.getElementById('crumb');

/* rail */
(function buildRail(){
  let html = '', lastGroup = '';
  SCREENS.forEach((s,i)=>{
    if (s.group !== lastGroup){ html += `<h2>${s.group}</h2>`; lastGroup = s.group; }
    html += `<a data-i="${i}" data-v="0" role="button" tabindex="0"><span class="n">${s.n}</span><span>${s.title}</span></a>`;
    if (s.variants.length > 1){
      s.variants.forEach((v,j)=>{ html += `<a class="alt" data-i="${i}" data-v="${j}" role="button" tabindex="0"><span class="n"></span><span>${v.name}</span></a>`; });
    }
  });
  railEl.innerHTML = html;
  railEl.addEventListener('click', e=>{
    const a = e.target.closest('a[data-i]'); if(!a) return;
    go(+a.dataset.i, +a.dataset.v);
  });
  railEl.addEventListener('keydown', e=>{
    if(e.key!=='Enter' && e.key!==' ') return;
    const a = e.target.closest('a[data-i]'); if(!a) return;
    e.preventDefault(); go(+a.dataset.i, +a.dataset.v);
  });
})();

/* build one phone */
function phone(v, theme){
  return `<div class="frame${v.land?' land':''}">
    <div class="ph" data-t="${theme}">
      ${v.land ? '' : osbar()}
      ${v.html}
      ${v.kb ? keyboard(v.goLabel || 'guess') : ''}
      ${v.land ? '' : home}
    </div>
  </div>`;
}

function render(){
  const s = SCREENS[cur];
  const v = s.variants[Math.min(curVar, s.variants.length-1)];
  crumbEl.textContent = `${s.n} / ${String(SCREENS.length).padStart(2,'0')} · ${s.title}${s.variants.length>1?' · '+v.name:''}`;

  const themes = mode === 'both' ? ['light','dark'] : [mode];
  const deck = themes.map(t=>`
    <div class="slot">
      <span class="cap">${t} · 390 × 844</span>
      <div class="fitbox">${phone(v,t)}</div>
    </div>`).join('');

  stageEl.innerHTML = `
    <div class="shead">
      <div>
        <div class="eyebrow">${s.group} · screen ${s.n}</div>
        <h2>${s.title}</h2>
      </div>
    </div>
    <p class="lede">${s.lede}</p>
    ${s.variants.length>1 ? `<div class="vtabs" role="group" aria-label="Proposals">${
      s.variants.map((x,j)=>`<button class="vtab" data-v="${j}" aria-pressed="${j===curVar}">${x.name}${x.ships?' <i class="ships">built</i>':''}</button>`).join('')
    }</div>` : (v.ships ? `<div class="vtabs"><span class="vtab" aria-pressed="true">Built <i class="ships">built</i></span></div>` : '')}
    <div class="deck">${deck}</div>
    ${s.variants.length>1 ? `<p class="verdict">${v.ships
      ? 'This is the one that shipped — the artboard is drawn from the build.'
      : 'Drawn as an alternative; the build went the other way.'}</p>` : ''}
    <div class="notes">
      <div class="note bad"><h3>What it was</h3><ul>${v.bad.map(b=>`<li>${b}</li>`).join('')}</ul></div>
      <div class="note good"><h3>What it is now</h3><ul>${v.good.map(b=>`<li>${b}</li>`).join('')}</ul></div>
    </div>
    <div class="pager">
      <button class="tbtn" data-nav="-1">◀ ${SCREENS[(cur-1+SCREENS.length)%SCREENS.length].title}</button>
      <span class="sp"></span>
      <button class="tbtn" data-nav="1">${SCREENS[(cur+1)%SCREENS.length].title} ▶</button>
    </div>`;

  stageEl.querySelectorAll('.vtab').forEach(b=>b.onclick=()=>{ curVar=+b.dataset.v; render(); syncRail(); });
  stageEl.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>go((cur+ +b.dataset.nav + SCREENS.length)%SCREENS.length, 0));
  fit();
  syncRail();
  stageEl.scrollIntoView({block:'start'});
  window.scrollTo({top:0});
}

function syncRail(){
  railEl.querySelectorAll('a').forEach(a=>{
    const i=+a.dataset.i, v=+a.dataset.v;
    const isAlt = a.classList.contains('alt');
    a.classList.toggle('on', i===cur && (isAlt ? v===curVar : SCREENS[i].variants.length===1 || true) && (isAlt ? v===curVar : !isAlt));
  });
  railEl.querySelectorAll('a.alt').forEach(a=>{
    a.classList.toggle('on', +a.dataset.i===cur && +a.dataset.v===curVar);
  });
  railEl.querySelectorAll('a:not(.alt)').forEach(a=>{
    a.classList.toggle('on', +a.dataset.i===cur && SCREENS[cur].variants.length===1);
  });
  const active = railEl.querySelector('a.on');
  if (active && window.innerWidth<=1000) active.scrollIntoView({inline:'center',block:'nearest'});
}

function go(i,v){ cur=i; curVar=v||0; render(); }

/* scale phones to fit the column */
function fit(){
  const boxes = stageEl.querySelectorAll('.fitbox');
  if(!boxes.length) return;
  /* A collapsed or not-yet-laid-out column reports 0; scaling off that would
     shrink every frame to nothing. Wait for a real measurement instead. */
  if (stageEl.clientWidth < 200){ requestAnimationFrame(fit); return; }
  const avail = stageEl.clientWidth - 60;
  const n = boxes.length;
  boxes.forEach(box=>{
    const f = box.querySelector('.frame');
    const w = f.classList.contains('land') ? 844 : 390;
    const h = f.classList.contains('land') ? 390 : 844;
    const per = n>1 ? (avail - 34)/n : avail;
    let s = Math.min(1, per / (w + 24));
    if (h*s > window.innerHeight*1.25) s = Math.min(s, (window.innerHeight*1.25)/h);
    f.style.transform = `scale(${s})`;
    box.style.width = (w*s + 24) + 'px';
    box.style.height = (h*s + 24) + 'px';
    f.style.margin = '12px';
  });
}
window.addEventListener('resize', fit);
if (window.ResizeObserver) new ResizeObserver(()=>fit()).observe(stageEl);

/* controls */
const modeBtns = {both:document.getElementById('mBoth'), light:document.getElementById('mLight'), dark:document.getElementById('mDark')};
Object.entries(modeBtns).forEach(([k,b])=>b.onclick=()=>{
  mode=k; Object.entries(modeBtns).forEach(([k2,b2])=>b2.setAttribute('aria-pressed', String(k2===k))); render();
});
document.getElementById('prevBtn').onclick=()=>go((cur-1+SCREENS.length)%SCREENS.length,0);
document.getElementById('nextBtn').onclick=()=>go((cur+1)%SCREENS.length,0);
document.getElementById('shellTheme').onclick=()=>{
  const r=document.documentElement;
  const isDark = r.getAttribute('data-theme')==='dark' ||
    (!r.getAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches);
  r.setAttribute('data-theme', isDark?'light':'dark');
};
document.addEventListener('keydown', e=>{
  if(e.target.matches('input,textarea')) return;
  if(e.key==='ArrowRight'){ go((cur+1)%SCREENS.length,0); }
  if(e.key==='ArrowLeft'){ go((cur-1+SCREENS.length)%SCREENS.length,0); }
});

render();
</script>
