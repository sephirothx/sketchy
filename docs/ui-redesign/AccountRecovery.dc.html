<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }

    [data-theme="light"] { --paper: #FAF6EF; --well: #FAF6EF; --card: #FFFFFF; --field: #FFFFFF; --ink: #292520; --muted: #6F6759; --faint: #A29883; --line: #E7DFD2; --lineStrong: #D3C8B4; --track: #F1EBE0; --guestBg: #F0EADD; --avatarInk: #FFFFFF; --avMarta: #0F766E; --avBruno: #C2410C; --avYuki: #7E22CE; --avInes: #0369A1; --avGuest: #5B6472; --primaryEdgeSoft: #C9CCF4; --scrim: rgba(30, 27, 22, 0.5); --primary: #5157D8; --primarySoft: #EEEFFB; --primaryInk: #3B41B5; --primaryEdge: #3B41B5; --warm: #E8703A; --warmSoft: #FBEADF; --warmInk: #B5541F; --warmEdge: #C1521F; --success: #2F9E44; --successSoft: #E7F5EA; --successInk: #1F7A33; --warning: #B45309; --warningSoft: #FDF1DC; --warningEdge: #EBC98A; --danger: #C92A2A; --dangerSoft: #FBECEC; --gold: #8A6D0B; --silver: #5A6472; --bronze: #8A5A2E; --pcMarta: #0F766E; --pcBruno: #C2410C; --pcYuki: #7E22CE; --pcInes: #0369A1; --pcSparrow: #8A8272; }
    [data-theme="dark"] { --paper: #0F172A; --well: rgba(2, 6, 23, 0.35); --card: #1E293B; --field: #0F172A; --ink: #F8FAFC; --muted: #94A3B8; --faint: #64748B; --line: #334155; --lineStrong: #475569; --track: rgba(2, 6, 23, 0.45); --guestBg: rgba(148, 163, 184, 0.18); --avatarInk: #132036; --avMarta: #5EE0C2; --avBruno: #F5B26B; --avYuki: #D9B8F5; --avInes: #82AACB; --avGuest: #C3CBD8; --primaryEdgeSoft: rgba(102, 108, 228, 0.5); --scrim: rgba(2, 6, 23, 0.6); --primary: #666CE4; --primarySoft: rgba(102, 108, 228, 0.17); --primaryInk: #C7CBFA; --primaryEdge: #3B41B5; --warm: #EE7E48; --warmSoft: rgba(238, 126, 72, 0.15); --warmInk: #FDBA74; --warmEdge: #9A3412; --success: #4ADE80; --successSoft: rgba(74, 222, 128, 0.13); --successInk: #86EFAC; --warning: #FBBF24; --warningSoft: rgba(251, 191, 36, 0.13); --warningEdge: rgba(251, 191, 36, 0.4); --danger: #F87171; --dangerSoft: rgba(248, 113, 113, 0.14); --gold: #F5CE62; --silver: #B9C4D4; --bronze: #DFA878; --pcMarta: #2BB3A0; --pcBruno: #F08A54; --pcYuki: #BF87ED; --pcInes: #4FA8E0; --pcSparrow: #A0A5B2; }
    [data-theme] input::placeholder, [data-theme] textarea::placeholder { color: var(--faint); }
    [data-theme] a { color: var(--primary); text-decoration: none; font-weight: 700; }
    [data-theme] a:hover { color: var(--primaryInk); }
    [data-tab="general"] [data-pref-panel]:not([data-pref-panel="general"]) { display: none; }
    [data-tab="game"] [data-pref-panel]:not([data-pref-panel="game"]) { display: none; }
    [data-tab="shortcuts"] [data-pref-panel]:not([data-pref-panel="shortcuts"]) { display: none; }
    [data-pref-tab][aria-current="true"] { background: var(--primarySoft) !important; border-color: var(--primary) !important; }
    [data-pref-tab][aria-current="true"] strong { color: var(--primaryInk) !important; }
    [data-pref-tab][aria-current="true"] > span:first-child { color: var(--primary) !important; }
    h1, h2, h3, h4, p, ul, ol, fieldset, legend { margin: 0; }
    button { cursor: pointer; }
    summary { cursor: pointer; }
    summary.plain { list-style: none; }
    summary.plain::-webkit-details-marker { display: none; }
  </style>
</helmet>
<div data-theme="{{theme}}" style="min-height: 100vh; background: var(--paper); color: var(--ink); font-family: 'Nunito Sans', 'Segoe UI', system-ui, sans-serif">

<div style="width: 880px; min-height: 560px; display: flex; align-items: center; justify-content: center; padding: 40px 24px">
  <div style="display: grid; grid-template-columns: 1fr 1.15fr; background: var(--card); border: 1.5px solid var(--line); border-radius: 18px; box-shadow: 0 10px 30px rgba(20, 16, 10, 0.14); overflow: hidden; width: 100%">
    <section style="background: var(--primarySoft); padding: 34px 28px; display: flex; flex-direction: column; justify-content: flex-end; gap: 10px">
      <h2 style="font-family: 'Fredoka', 'Trebuchet MS', system-ui, sans-serif; font-weight: 600; font-size: 26px; line-height: 1.25; color: var(--primaryInk)">Even the best guessers forget sometimes.</h2>
      <svg width="110" height="8" viewBox="0 0 110 8" fill="none" aria-hidden="true" style="display: block"><path d="M2 5 C 15.400000000000002 1, 24.2 7, 39.6 4 C 55 1, 68.2 7, 83.6 4 C 94.6 2, 103.39999999999999 5, 108 3" stroke-width="2.5" stroke-linecap="round" style="stroke: var(--primary)"/></svg>
      <p style="font-size: 13.5px; color: var(--muted); font-weight: 600; line-height: 1.5">We'll send a secure, time-limited link to the confirmed email on your account.</p>
    </section>
    <section style="padding: 30px 32px; display: grid; gap: 13px; align-content: start">
      <span style="display: inline-flex; flex-direction: column; gap: 1px; width: fit-content">
    <span style="font-family: 'Fredoka', 'Trebuchet MS', system-ui, sans-serif; font-weight: 600; font-size: 22px; letter-spacing: 0.01em; color: var(--ink); line-height: 1">Sketchy</span>
    <svg width="57" height="8" viewBox="0 0 57 8" fill="none" aria-hidden="true" style="display: block"><path d="M2 5 C 7.98 1, 12.540000000000001 7, 20.52 4 C 28.5 1, 35.339999999999996 7, 43.32 4 C 49.019999999999996 2, 53.58 5, 55 3" stroke-width="2.5" stroke-linecap="round" style="stroke: var(--warm)"/></svg>
  </span>
      <div style="margin-top: 8px">
        <p style="color: var(--faint); font-size: 11.5px; font-weight: 800; letter-spacing: 0.09em; margin: 0; text-transform: uppercase">Account help</p>
        <h1 style="font-family: 'Fredoka', 'Trebuchet MS', system-ui, sans-serif; font-weight: 600; font-size: 23px; color: var(--ink); margin-top: 4px">Reset your password</h1>
      </div>
      <p style="font-size: 13.5px; color: var(--muted); font-weight: 600; line-height: 1.5">Enter your username or email. If it matches an account, a reset link is on its way.</p>
      <label style="display: grid; gap: 6px; font-size: 13.5px; font-weight: 800; color: var(--ink)">Username or email
        <input type="text" placeholder="marta@example.com" style="background: var(--field); border: 1.5px solid var(--lineStrong); border-radius: 10px; padding: 10px 12px; font-family: 'Nunito Sans', 'Segoe UI', system-ui, sans-serif; font-size: 14.5px; color: var(--ink); min-height: 42px; width: 100%">
      </label>
      <button type="button" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: var(--primary); color: #fff; border: 0; border-radius: 10px; padding: 13px 22px; font-family: 'Nunito Sans', 'Segoe UI', system-ui, sans-serif; font-size: 16px; font-weight: 800; min-height: 44px; box-shadow: 0 2px 0 var(--primaryEdge); width: 100%">Send a reset link</button>
      <button type="button" style="display: inline-flex; align-items: center; justify-content: center; gap: 7px; background: transparent; color: var(--muted); border: 0; border-radius: 10px; padding: 10px 12px; font-family: 'Nunito Sans', 'Segoe UI', system-ui, sans-serif; font-size: 14px; font-weight: 800; min-height: 44px; justify-self: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>Back to the lobby</button>
    </section>
  </div>
</div>
</div>
</x-dc>
<script data-dc-script data-props='{"theme": {"editor": "enum", "options": ["light", "dark"], "default": "light"}, "$preview": {"width": 880, "height": 560}}'>
class Component extends DCLogic {
  renderVals() {
    const defaults = { theme: 'light' };
    return Object.assign({}, defaults, this.props);
  }
}
</script>
</body>
</html>
