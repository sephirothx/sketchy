<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Two audiences, one tag. Link crawlers (Discord draws the embed's accent
         strip from theme-color, and does not run JS) keep this static orange —
         the same #ee7e48 as the card's swoosh and tagline. Real browsers run
         the pre-paint script below, which overwrites it with --paper before
         first paint, so mobile chrome still matches the theme the player chose
         rather than going orange.

         This is the only place the browser chrome's colour is stated. Do not
         put `theme_color` back in manifest.webmanifest: an installed PWA in
         standalone mode takes the status bar from the manifest, a manifest
         cannot answer to a theme, and a static value there paints a dark app's
         status bar in light paper regardless of what this tag says. -->
    <meta name="theme-color" content="#ee7e48" />
    <meta name="description" content="Draw, guess and laugh with friends!" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sketchy" />
    <meta property="og:title" content="Sketchy" />
    <meta property="og:description" content="Draw, guess and laugh with friends!" />
    <!-- Root-relative here, because the build knows no origin. The server
         writes each public page's own title, description, canonical URL and
         og:url into its copy of this file, with this image made absolute on
         PUBLIC_BASE_URL (backend/app/seo_pages.py, #1459); every other page,
         a room's invite link included, is served this file as it is, and
         Slack, Discord and iMessage resolve the image against the page they
         fetched. Keep these tags in this form: the server replaces each in
         place, and serves every page this plain file when one is missing. -->
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <title>Sketchy</title>
    <!-- Ask who this is before any bundle has downloaded (#983): the first
         paint waits for the answer, and it depends on nothing in the bundle.
         lib/api.ts adopts this request rather than making its own, so it is
         still the one request - a second cookieless one would race it. The
         catch only keeps a network failure from being reported as unhandled;
         the adopter sees the rejection. -->
    <script>
      try {
        var sketchyAbort = new AbortController();
        var sketchyMe = fetch("/api/auth/me", { credentials: "same-origin", signal: sketchyAbort.signal });
        sketchyMe.catch(function () {});
        window.__sketchyShellRequest = {
          path: "/api/auth/me",
          response: sketchyMe,
          abort: function () { sketchyAbort.abort(); },
        };
      } catch (e) {}
    </script>
    <script>
      try {
        var stored = localStorage.getItem("sketchy_theme");
        var theme =
          stored === "dark" || stored === "light"
            ? stored
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        var tc = document.querySelector('meta[name="theme-color"]');
        if (tc) tc.content = theme === "dark" ? "#0f172a" : "#faf6ef";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Shown by main.tsx only when no language at all could be fetched
         (#1426): English is a chunk too, so there are no words to draw the
         app with, and this needs none. -->
    <div id="no-words" class="no-words" role="alert" hidden>
      <p>Sketchy could not finish loading. Check your connection, then reload the page.</p>
      <button type="button" class="btn btn-primary">Reload</button>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
