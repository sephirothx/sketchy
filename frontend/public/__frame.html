<!doctype html><html><head><meta charset="utf-8"><title>frame</title>
<style>html,body{margin:0;background:#111;overflow:hidden}
#wrap{transform:scale(var(--s,.52));transform-origin:top left}
iframe{border:0;display:block;background:#fff}</style></head><body>
<div id="wrap"><iframe id="f" src="/" width="390" height="844"></iframe></div>
<script>
 window.setScale=(s)=>document.getElementById('wrap').style.setProperty('--s',s);
 window.setFrame=(w,h)=>{f.width=w;f.height=h};
 window.app=()=>f.contentWindow;
 window.setVal=(el,v)=>{const d=Object.getOwnPropertyDescriptor(Object.getPrototypeOf(el),'value');d.set.call(el,v);el.dispatchEvent(new el.ownerDocument.defaultView.Event('input',{bubbles:true}));};
 window.wake=()=>{const d=app().document;Object.defineProperty(d,'visibilityState',{get:()=>'visible',configurable:true});Object.defineProperty(d,'hidden',{get:()=>false,configurable:true});d.dispatchEvent(new (app().Event)('visibilitychange'));};
</script></body></html>
