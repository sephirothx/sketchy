<svg xmlns="http://www.w3.org/2000/svg">
  <!-- The doodle set a registered player may wear instead of an initial
       (R-AVA-06). Every symbol is drawn with currentColor on a 24x24 grid,
       so the disc's ink paints it whatever the theme. Presentation attributes,
       not a stylesheet: a stylesheet does not follow a symbol through an
       external <use>. Keep to a few strokes,
       because the smallest disc is 19 pixels across. The server's list of
       ids lives in backend/app/auth/avatar_doodles.py and the client's in
       frontend/src/lib/avatarDoodles.ts; tests hold the three together. -->
